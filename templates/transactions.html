{% extends "base.html" %}
{% block content %}
    <h1>Transactions</h1>
    
    <form id="txForm" style="background: #f9f9f9; padding: 15px; border-radius: 5px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
        <input type="text" name="title" placeholder="Title" required style="padding: 8px; border: 1px solid #cbd5e0; border-radius: 4px;">
        <input type="number" step="0.01" name="amount" placeholder="Amount" required style="padding: 8px; border: 1px solid #cbd5e0; border-radius: 4px;">
        <select name="type" style="padding: 8px; border: 1px solid #cbd5e0; border-radius: 4px;">
            <option value="Income">Income</option>
            <option value="Expense">Expense</option>
        </select>
        
        <div style="display: flex; gap: 5px;">
            <select id="txCategory" name="category" required style="padding: 8px; border: 1px solid #cbd5e0; border-radius: 4px;">
                <option value="" disabled selected>Category</option>
                <option value="PAYCHECK">Paycheck</option>
                <option value="FOOD">Food</option>
                <option value="TRANSPORT">Transport</option>
                <option value="ENTERTAINMENT">Entertainment</option>
                <option value="UTILITIES">Utilities</option>
            </select>
            <button type="button" onclick="addCategory('txCategory')" style="padding: 8px 12px; background-color: #edf2f7; border: 1px solid #cbd5e0; border-radius: 4px; cursor: pointer; font-weight: bold; color: #4a5568;">+ Category</button>
        </div>
        
        <button type="submit" style="padding: 8px 16px; background-color: #3182ce; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Add Entry</button>
    </form>

    <table id="txTable">
        <thead>
            <tr>
                <th>Date</th>
                <th>Title</th>
                <th>Category</th>
                <th>Amount</th>
                <th>Type</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="txBody">
            {% for tx in transactions %}
            <tr id="row-{{ tx.id }}">
                <td>{{ tx.date.strftime('%Y-%m-%d') }}</td>
                <td>{{ tx.title }}</td>
                <td>{{ tx.category }}</td>
                <td>{{ tx.amount }}</td>
                <td style="padding: 12px;">
                    <span style="color: {{ 'green' if tx.type|upper == 'INCOME' else 'red' }}; font-weight: bold;">
                        {{ tx.type }}
                    </span>
                </td>
                <td style="padding: 12px; text-align: center;">
                    <button onclick="deleteRow({{ tx.id }})" style="background: none; border: none; color: #a0aec0; font-size: 1.2rem; cursor: pointer; font-weight: bold;" title="Delete">✕</button>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <script>
        function addCategory(selectId) {
            const newCat = prompt("Enter new category name:");
            if (newCat && newCat.trim() !== "") {
                const val = newCat.trim().toUpperCase();
                const select = document.getElementById(selectId);
                let exists = false;
                for (let i = 0; i < select.options.length; i++) {
                    if (select.options[i].value === val) exists = true;
                }
                if (!exists) {
                    const option = document.createElement("option");
                    option.value = val;
                    option.text = newCat.trim();
                    select.add(option);
                }
                select.value = val;
            }
        }

        document.getElementById('txForm').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            
            const response = await fetch('/transactions', {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                window.location.reload(); 
            }
        };

        async function deleteRow(id) {
            if (confirm("Are you sure you want to delete this transaction?")) {
                const response = await fetch(`/delete_tx/${id}`, { method: 'POST' });
                if (response.ok) {
                    const row = document.getElementById(`row-${id}`);
                    if (row) row.remove();
                } else {
                    alert("Failed to delete transaction.");
                }
            }
        }
    </script>
{% endblock %}
