{% extends "base.html" %}
{% block content %}
    <h1>Transactions</h1>
    
    <form id="txForm" style="background: #f9f9f9; padding: 15px; border-radius: 5px;">
        <input type="text" name="title" placeholder="Title" required>
        <input type="number" step="0.01" name="amount" placeholder="Amount" required>
        <select name="type">
            <option value="Income">Income</option>
            <option value="Expense">Expense</option>
        </select>
        <input type="text" name="category" placeholder="Category" required>
        <button type="submit">Add Entry</button>
    </form>

    <table id="txTable">
        <thead>
            <tr>
                <th>Date</th>
                <th>Title</th>
                <th>Category</th>
                <th>Amount</th>
                <th>Type</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="txBody">
            {% for tx in transactions %}
            <tr id="row-{{ tx.id }}">
                <td>{{ tx.date.strftime('%Y-%m-%d') }}</td>
                <td>{{ tx.title }}</td>
                <td>{{ tx.category }}</td>
                <td>{{ tx.amount }}</td>
                <td style="padding: 12px;">
                    <span style="color: {{ 'green' if tx.type|upper == 'INCOME' else 'red' }}; font-weight: bold;">
                        {{ tx.type }}
                    </span>
                </td>
                <td style="padding: 12px; text-align: center;">
                    <button onclick="deleteRow({{ tx.id }})" style="background: none; border: none; color: #a0aec0; font-size: 1.2rem; cursor: pointer; font-weight: bold;" title="Delete">✕</button>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <script>
        document.getElementById('txForm').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            
            const response = await fetch('/transactions', {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                // To maintain sync with the page reload loop, reloading guarantees accurate DB representations
                window.location.reload(); 
            }
        };

        async function deleteRow(id) {
            if (confirm("Are you sure you want to delete this transaction?")) {
                const response = await fetch(`/delete_tx/${id}`, { method: 'POST' });
                if (response.ok) {
                    const row = document.getElementById(`row-${id}`);
                    if (row) row.remove(); // Removes it from the screen instantly
                } else {
                    alert("Failed to delete transaction.");
                }
            }
        }
    </script>
{% endblock %}
